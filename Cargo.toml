[workspace]
resolver = "2"
members = ["gm-proximity", "geolib", "bench", "convert", "spatial"]
exclude = ["data/*"]

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1.0.97"
clap = { version = "^4.5", features = ["derive"] }
geo = "^0.29"
csv = "^1.3"
shapefile = { version = "^0.6", features = ["geo-types"] }
geojson = { version = "^0.24", features = ["geo-types"] }
kml = "^0.11"
serde_json = "^1.0"
wkt = "0.13.0"
wkb = "0.8.0"
geo-traits = "0.2.0"
geolib = { path = "geolib" }
spatial = { path = "spatial" }
# TODO: Is serde even required? And should rand be dev or bench only?

[profile.debug-release]
inherits = "release"
debug = true
